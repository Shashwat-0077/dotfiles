
# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes

    # Soft, natural curves
    bezier = smooth,         0.25, 1,    0.30, 1
    bezier = gentle,         0.22, 0.9,  0.25, 1
    bezier = easeInOutSoft,  0.45, 0.05, 0.30, 0.95
    bezier = linear,         0,    0,    1,    1

    # Global speed scale (lower = slower/smoother)
    animation = global,        1,   4.8, smooth

    # Windows movement & open/close
    animation = windows,       1,   4.2, smooth
    animation = windowsIn,     1,   4.4, gentle       # no popin for minimal feel
    animation = windowsOut,    1,   3.3, easeInOutSoft

    # # Borders + subtle fade
    # animation = border,        1,   5,   smooth
    # animation = fade,          1,   2.5, smooth
    # animation = fadeIn,        1,   1.9, gentle
    # animation = fadeOut,       1,   1.8, gentle

    # # Layers (notifications, menus, rofi, etc.)
    # animation = layers,        1,   3.8, smooth
    # animation = layersIn,      1,   4,   smooth, fade
    # animation = layersOut,     1,   2.1, gentle, fade

    # Workspace switching — slower, smooth sliding
    animation = workspaces,    1,   5, smooth, slide
    animation = workspacesIn,  1,   5, smooth, slide
    animation = workspacesOut, 1,   5, smooth, slide

    # Zoom (if used, eg. zoom plugin)
    animation = zoomFactor,    1,   5.2, gentle
}
